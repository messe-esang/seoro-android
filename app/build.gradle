plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.messe.seoro'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.messe.seoro"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.firebase.messaging
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.messaging.v2341

    //OkHttp (http://square.github.io/okhttp/)
    implementation libs.okhttp

    //Permission check
    implementation libs.tedpermission.normal

    //Google play app version check
    implementation libs.jsoup

    //Play store core
    implementation libs.feature.delivery
    implementation libs.app.update

    //#Appsflyer Start
    //make sure to use the latest SDK version: https://mvnrepository.com/artifact/com.appsflyer/af-android-sdk
    implementation libs.af.android.sdk
    implementation libs.installreferrer
    //#Appsflyer End

    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    //카카오 로그인
    implementation libs.v2.user.v2120 // 카카오 로그인
    implementation libs.v2.share // 메시지(카카오링크)

    //Naver login
    implementation libs.oauth // jdk 11
}